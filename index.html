<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--pri:#0f6e6e;--pri2:#0b5555;--acc:#f08a24;--bg:#f6f3ec;--card:#fff;--ink:#22282b;--mut:#6b7378;--line:#e4ded2;--ok:#1a8a4a;--warn:#c77800;--bad:#c0392b;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--pri)}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.05rem}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(135deg,var(--pri),#138a7f);color:#fff;padding:22px 16px 26px;border-radius:0 0 22px 22px}
.hero .k{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:1.7rem;margin:.15em 0 .2em}
.hero p{margin:0;opacity:.92}
.hero .brand{display:flex;align-items:center;gap:14px}
.hero .brand img{width:86px;height:86px;object-fit:contain;flex:none;background:#fff;border-radius:50%;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
@media(max-width:400px){.hero .brand img{width:70px;height:70px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h2,.card h3{margin-top:0}
.muted{color:var(--mut)}.small{font-size:.86rem}.tiny{font-size:.76rem}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 200px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:.84rem;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(15,110,110,.12)}
textarea{min-height:80px;resize:vertical}
.chk{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;background:#fff}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--pri)}
.chk.on{border-color:var(--pri);background:#eef7f6}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.weeks .chk{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:var(--pri);color:#fff;cursor:pointer;text-decoration:none;min-height:46px}
.btn:hover{background:var(--pri2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.acc{background:var(--acc)}
.btn.bad{background:var(--bad)}
.btn.ghost{background:transparent;color:var(--pri);padding:8px 10px;min-height:0}
.btn.sm{padding:7px 12px;min-height:0;font-size:.88rem;border-radius:9px}
.btn.block{width:100%}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;background:#eef0f1;color:#4a5358;white-space:nowrap}
.pill.ok{background:#e3f4ea;color:var(--ok)}.pill.warn{background:#fff1dc;color:var(--warn)}.pill.bad{background:#fde8e6;color:var(--bad)}.pill.pri{background:#e2f1f0;color:var(--pri)}
.banner{border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:600}
.banner.ok{background:#e3f4ea;color:#14663a}.banner.warn{background:#fff1dc;color:#8a5300}.banner.bad{background:#fde8e6;color:#962d22}.banner.info{background:#e2f1f0;color:var(--pri2)}
.err{color:var(--bad);font-weight:600;margin-top:8px}
.price{font-variant-numeric:tabular-nums;font-weight:700}
.tot{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.tot:last-child{border-bottom:0}
.tot.big{font-size:1.15rem;font-weight:800;border-top:2px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:10px}
.alias{font-size:1.35rem;font-weight:800;color:var(--pri);letter-spacing:.02em;word-break:break-all}
.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps span{flex:1;height:5px;border-radius:9px;background:#dcd5c6}
.steps span.on{background:var(--acc)}
.kid{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0;background:#fff}
.kid.on{border-color:var(--pri)}
.kid-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggle{position:relative;width:52px;height:30px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:#cfc8b8;border-radius:30px;transition:.2s;cursor:pointer}
.toggle span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--pri)}
.toggle input:checked+span:before{transform:translateX(22px)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:10px;background:#ebe6dc;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.spin.dark{border-color:rgba(0,0,0,.12);border-top-color:var(--pri)}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#22282b;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25);font-weight:600}
.toast.bad{background:var(--bad)}
.center{text-align:center}
.hide{display:none!important}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(20,24,26,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>.box{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px 30px}
@media(min-width:800px){.modal{align-items:center}.modal>.box{border-radius:20px}}
.modal .close{float:right}
@media print{.noprint{display:none!important}body{background:#fff}.card{border:0;box-shadow:none;padding:0}}
</style>

</head>

<script>
/* Utilidades compartidas por las 3 páginas */
var $ = function (s, el) { return (el || document).querySelector(s); };
var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };

function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function money(n) {
  n = Math.round(Number(n) || 0);
  return (n < 0 ? '-$' : '$') + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function numIn(v) {
  var s = String(v || '').replace(/[$\s]/g, '');
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/[.,](?=\d{3}(\D|$))/g, '');
  var n = parseFloat(s); return isNaN(n) ? 0 : n;
}
function fdate(s) {
  if (!s) return '';
  var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : String(s);
}
function today() {
  var d = new Date(); var z = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
}
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }

function toast(msg, bad) {
  var t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, bad ? 5200 : 3200);
}

/** Llama al servidor. fn = 'pub' | 'api' | 'login'. Devuelve una Promise con data o error. */
function server(fn, args) {
  if (window.API_URL) return serverFetch(fn, args);
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(function (res) {
      if (res && res.ok) resolve(res.data);
      else { var e = new Error((res && res.error) || 'Error'); e.auth = res && res.auth; reject(e); }
    }).withFailureHandler(function (e) {
      reject(new Error(/network|NetworkError|Failed to fetch/i.test(String(e && e.message)) ? 'Sin conexión. Revisá internet y probá de nuevo.' : (e && e.message) || 'Error de conexión'));
    });
    r[fn].apply(r, args);
  });
}

/** Versión para la página externa: POST sin cookies de Google. */
function serverFetch(fn, args) {
  var send = function () {
    return fetch(window.API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) });
  };
  return send().catch(function () { return new Promise(function (r) { setTimeout(r, 1200); }).then(send); })
    .catch(function () { throw new Error('Sin conexión. Revisá internet y probá de nuevo.'); })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var res; try { res = JSON.parse(t); } catch (e) { throw new Error('El sistema no respondió bien. Probá de nuevo en un momento.'); }
      if (res && res.ok) return res.data;
      var e = new Error((res && res.error) || 'Error'); e.auth = res && res.auth; throw e;
    });
}

/**
 * Pide datos que cambian poco (configuración): si hay una copia guardada en este aparato se usa al instante
 * y después llega la versión nueva. onData(data, fresh, hadCache).
 */
function cachedServer(key, fn, args, onData, onError) {
  var had = null;
  try { had = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { had = null; }
  if (had) onData(had, false, true);
  return server(fn, args).then(function (d) {
    try { localStorage.setItem(key, JSON.stringify(d)); } catch (e) {}
    onData(d, true, !!had);
  }).catch(function (e) { if (!had && onError) onError(e); });
}

/** Pone un botón en estado "cargando" mientras corre la promesa. */
function busy(btn, promise) {
  if (!btn) return promise;
  var html = btn.innerHTML; btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';
  return promise.then(function (x) { btn.disabled = false; btn.innerHTML = html; return x; },
    function (e) { btn.disabled = false; btn.innerHTML = html; throw e; });
}

/** Lee un archivo (foto o PDF). Las fotos se achican a 1600px para que suban rápido. */
function readFile(file, maxSide) {
  maxSide = maxSide || 1600;
  return new Promise(function (resolve, reject) {
    if (!file) return reject(new Error('No hay archivo'));
    var fr = new FileReader();
    fr.onerror = function () { reject(new Error('No se pudo leer el archivo')); };
    if (!/^image\//.test(file.type) || /gif|svg/.test(file.type)) {
      fr.onload = function () { resolve({ name: file.name, mime: file.type || 'application/pdf', data: String(fr.result).split(',')[1], preview: null }); };
      return fr.readAsDataURL(file);
    }
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height, k = Math.min(1, maxSide / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var url = c.toDataURL('image/jpeg', 0.72);
        resolve({ name: file.name, mime: 'image/jpeg', data: url.split(',')[1], preview: url });
      };
      img.onerror = function () { resolve({ name: file.name, mime: file.type, data: String(fr.result).split(',')[1], preview: fr.result }); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function copyText(t, el) {
  var done = function () { toast('Copiado: ' + t); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { fallbackCopy(t); done(); });
  else { fallbackCopy(t); done(); }
}
function fallbackCopy(t) { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); }

/** Precio en el navegador (igual que el servidor) para mostrarlo en vivo. El servidor siempre recalcula. */
function calcPrice(cfg, categoria, weeks, earlyBird) {
  var p = cfg.precios[categoria];
  if (!p) return null;
  var total = cfg.semanas.length, n = weeks.length;
  if (!n) return null;
  var lista = n >= total ? p.mensual : Math.min(p.semanal * n, p.mensual || Infinity);
  var desc = earlyBird ? Math.round(lista * p.eb / 100 / 100) * 100 : 0;
  return { lista: lista, desc: desc, final: lista - desc, pct: earlyBird ? p.eb : 0, modalidad: n >= total ? 'Mensual' : (n === 1 ? '1 semana' : n + ' semanas') };
}
function salaFor(cfg, grado, sexo) {
  var g = norm(grado), sx = String(sexo || '').toUpperCase().charAt(0), m = null;
  cfg.salas.forEach(function (s) {
    if (m) return;
    if (String(s.grado).split('|').map(norm).indexOf(g) === -1) return;
    if (s.sexo && s.sexo !== 'X' && s.sexo.charAt(0) !== sx) return;
    m = s;
  });
  return m;
}
</script>

<script>
var S = { cfg: null, step: 'email', email: '', token: '', fam: {}, kids: [], estado: null, acepta: false, comentario: '' };
var GRADO_HINT = 'En qué sala o grado estuvo durante este año escolar';

function applyCfg(cfg) {
  S.cfg = cfg;
  $('#hname').textContent = cfg.nombre;
  $('#hk').textContent = 'Inscripción · Temporada ' + cfg.temporada;
  var w = cfg.semanas;
  $('#hsub').textContent = w.length ? 'Del ' + fdate(w[0].desde).substring(0, 5) + ' al ' + fdate(w[w.length - 1].hasta) : 'Colonia de verano';
}
// se muestra al instante con la configuración guardada en este aparato y se actualiza por detrás
cachedServer('mgi_cfg', 'pub', ['config', {}], function (cfg, fresh, hadCache) {
  applyCfg(cfg);
  if (!hadCache || !fresh) render();
}, function (e) { $('#app').innerHTML = '<div class="card"><div class="err">' + esc(e.message) + '</div></div>'; });

function go(step) { S.step = step; render(); window.scrollTo(0, 0); }

function stepsBar(n) {
  var h = '<div class="steps">';
  for (var i = 1; i <= 4; i++) h += '<span class="' + (i <= n ? 'on' : '') + '"></span>';
  return h + '</div>';
}

function render() {
  var c = S.cfg, h = '';
  if (!c.inscripcionAbierta && S.step !== 'estado' && S.step !== 'email' && S.step !== 'code') {
    $('#app').innerHTML = '<div class="card"><h2>La inscripción online está cerrada</h2><p>Comunicate con la oficina de la colonia.</p></div>'; return;
  }
  if (S.step === 'email') {
    h += c.earlyBirdActivo ? '<div class="banner ok">🎉 ¡Early bird! Inscribiéndote hasta el ' + fdate(c.earlyBirdHasta) + ' tenés descuento' +
      (c.earlyBirdPagoHasta ? ' (pagando el total antes del ' + fdate(c.earlyBirdPagoHasta) + ')' : '') + '.</div>' : '';
    h += '<div class="card"><h2>¡Hola! 👋</h2><p class="muted">Escribí tu email. Te mandamos un código para entrar. ' +
      'Si ya inscribiste chicos otros años o tenés otro hijo inscripto, vas a ver los datos de la familia ya cargados.</p>' +
      '<label>Tu email</label><input id="em" type="email" inputmode="email" autocomplete="email" placeholder="nombre@gmail.com" value="' + esc(S.email) + '">' +
      '<div id="er" class="err"></div><div class="actions"><button class="btn block" id="b1" onclick="sendCode(this)">Enviar código</button></div>' +
      '<p class="small muted">El código llega por mail. Si no lo ves en la bandeja de entrada, revisá el correo no deseado (Spam).</p></div>';
    if (!c.inscripcionAbierta) h = '<div class="banner warn">La inscripción de chicos nuevos está cerrada. Igual podés entrar para ver tu saldo o subir un comprobante.</div>' + h;
    h += contactCard();
  } else if (S.step === 'code') {
    h += '<div class="card"><h2>Revisá tu email</h2><p class="muted">Te mandamos un código de 6 números a <b>' + esc(S.email) + '</b>.</p>' +
      '<div class="banner warn">📩 ¿No te llegó? Revisá la carpeta de <b>correo no deseado (Spam)</b> y la pestaña <b>Promociones</b>. Puede tardar 1 o 2 minutos. ' +
      'Si lo encontrás ahí, marcalo como "No es spam" así te llegan bien el resto de los mails (y el carnet).</div>' +
      '<label>Código</label><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="font-size:1.6rem;letter-spacing:.4em;text-align:center">' +
      '<div id="er" class="err"></div><div class="actions"><button class="btn block" onclick="verify(this)">Continuar</button>' +
      '<button class="btn ghost" onclick="go(\'email\')">Cambiar email</button><button class="btn ghost" onclick="sendCode(this)">Mandar otro código</button></div></div>';
  } else if (S.step === 'familia') {
    var f = S.fam;
    h += stepsBar(1) + '<div class="card"><h2>Datos de la familia</h2>' +
      (S.prefilled ? '<div class="banner info">¡Ya teníamos tus datos! Revisalos y corregí lo que haya cambiado.</div>' : '') +
      '<div class="grid2">' + inp('Apellido de la familia *', 'apellido', f.apellido) + inp('Email', '', S.email, 'disabled') +
      inp('Nombre de la mamá *', 'nombreMama', f.nombreMama) + inp('Celular de la mamá *', 'celMama', f.celMama, 'inputmode="tel"') +
      inp('Nombre del papá *', 'nombrePapa', f.nombrePapa) + inp('Celular del papá *', 'celPapa', f.celPapa, 'inputmode="tel"') +
      inp('Teléfono de casa', 'telCasa', f.telCasa, 'inputmode="tel"') + inp('Teléfono en caso de emergencia *', 'telEmergencia', f.telEmergencia, 'inputmode="tel" placeholder="Nombre y teléfono"') +
      '</div>' + inp('Dirección', 'direccion', f.direccion) +
      '<div id="er" class="err"></div><div class="actions"><button class="btn block" onclick="nextFam()">Siguiente: los chicos →</button></div></div>';
  } else if (S.step === 'chicos') {
    h += stepsBar(2) + '<h2 style="margin-top:14px">¿A quién inscribís?</h2>';
    if (c.earlyBirdActivo) h += '<div class="banner ok">Early bird activo hasta el ' + fdate(c.earlyBirdHasta) + '.</div>';
    S.kids.forEach(function (k, i) { h += kidCard(k, i); });
    h += '<button class="btn sec block" onclick="addKid()">+ Agregar otro hijo/a</button>' +
      '<div class="card"><div id="kt"></div><div id="er" class="err"></div><div class="actions">' +
      '<button class="btn sec" onclick="go(\'familia\')">← Atrás</button><button class="btn" style="flex:1" onclick="nextKids()">Siguiente: revisar →</button></div></div>';
  } else if (S.step === 'resumen') {
    var sel = S.kids.filter(function (k) { return k.inscribir; });
    var tot = 0;
    h += stepsBar(3) + '<div class="card"><h2>Revisá la inscripción</h2>';
    sel.forEach(function (k) {
      var pr = kidPrice(k);
      tot += pr ? pr.final : 0;
      h += '<div class="tot"><div><b>' + esc(k.nombre) + '</b><div class="small muted">' + esc(pr ? pr.sala : '') + ' · ' + esc(pr ? pr.modalidad : '') + '</div>' +
        (pr && pr.desc ? '<div class="small" style="color:var(--ok)">Early bird ' + pr.pct + '% (−' + money(pr.desc) + ')</div>' : '') + '</div><div class="price">' + money(pr ? pr.final : 0) + '</div></div>';
    });
    if (c.materiales) { tot += c.materiales; h += '<div class="tot"><div>Materiales (por familia)</div><div class="price">' + money(c.materiales) + '</div></div>'; }
    if (S.estado && S.estado.esStaff && tot > 0) { h += '<div class="tot"><div>Sin cargo (familia del staff)</div><div class="price" style="color:var(--ok)">−' + money(tot) + '</div></div>'; tot = 0; }
    h += '<div class="tot big"><div>Total</div><div>' + money(tot) + '</div></div>' +
      '<p class="small muted">Si se aplica algún ajuste especial o ya hiciste pagos, lo vas a ver en el próximo paso.</p></div>';
    h += '<div class="card"><h3>Reglamento</h3><ul class="small">' + String(c.reglamento).split('\n').filter(String).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' +
      '<label class="chk' + (S.acepta ? ' on' : '') + '"><input type="checkbox" id="ac" ' + (S.acepta ? 'checked' : '') + ' onchange="S.acepta=this.checked;this.parentNode.classList.toggle(\'on\',this.checked)"> <span>Leí y acepto el reglamento</span></label>' +
      '<label>Comentarios (opcional)</label><textarea id="cm" oninput="S.comentario=this.value">' + esc(S.comentario) + '</textarea>' +
      '<div id="er" class="err"></div><div class="actions"><button class="btn sec" onclick="go(\'chicos\')">← Atrás</button>' +
      '<button class="btn acc" style="flex:1" onclick="submitReg(this)">Confirmar inscripción ✓</button></div></div>';
  } else if (S.step === 'estado') {
    h += estadoHtml();
  }
  $('#app').innerHTML = h;
  if (S.step === 'chicos') updateKidTotals();
  var first = $('#app input:not([disabled])'); if (first && (S.step === 'email' || S.step === 'code')) first.focus();
}

function inp(label, key, val, extra) {
  return '<div><label>' + esc(label) + '</label><input data-f="' + key + '" value="' + esc(val) + '" ' + (extra || '') + ' oninput="S.fam[this.dataset.f]=this.value"></div>';
}

function contactCard() {
  var w = S.cfg.whatsapp;
  return (w ? '<p class="center small muted">¿Dudas? <a href="https://wa.me/' + esc(String(w).replace(/\D/g, '')) + '" target="_blank">Escribinos por WhatsApp</a></p>' : '') +
    '<p class="center tiny muted"><a href="https://tinyurl.com/minigan-privacidad" target="_blank">Política de privacidad</a></p>';
}

function sendCode(btn) {
  var em = $('#em') ? $('#em').value.trim() : S.email;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { $('#er').textContent = 'Revisá el email.'; return; }
  S.email = em.toLowerCase();
  busy(btn, server('pub', ['sendCode', { email: S.email }])).then(function () {
    if (S.step === 'code') toast('Te mandamos un código nuevo'); else go('code');
  }).catch(function (e) { $('#er').textContent = e.message; });
}

function verify(btn) {
  var code = $('#cd').value.trim();
  if (code.length !== 6) { $('#er').textContent = 'El código tiene 6 números.'; return; }
  busy(btn, server('pub', ['verifyCode', { email: S.email, code: code }])).then(function (r) {
    loadFamily(r);
    var enrolled = r.chicos && r.chicos.some(function (k) { return k.inscripcion; });
    go(enrolled ? 'estado' : 'familia');
  }).catch(function (e) { $('#er').textContent = e.message; });
}

function loadFamily(r) {
  S.token = r.token;
  S.estado = r;
  if (r.nueva) { S.prefilled = false; if (!S.kids.length) S.kids = [blankKid()]; return; }
  S.prefilled = true;
  S.fam = r.familia || {};
  S.kids = (r.chicos || []).map(function (k) {
    var ins = k.inscripcion;
    return Object.assign({}, k, { inscribir: !!ins, semanas: ins ? ins.semanas.slice() : [], fechaNac: k.fechaNac || '' });
  });
}

function blankKid() {
  return { id: '', nombre: '', apellido: S.fam.apellido || '', sexo: '', fechaNac: '', grado: '', obraSocial: '', nroSocio: '', retiraCon: '', cumpleIvrit: '', alergias: '', inscribir: true, semanas: [], nuevo: true };
}
function addKid() { syncKids(); S.kids.push(blankKid()); render(); setTimeout(function () { var cards = $$('.kid'); cards[cards.length - 1].scrollIntoView({ behavior: 'smooth' }); }, 50); }

function nextFam() {
  var f = S.fam, miss = [];
  if (!String(f.apellido || '').trim()) miss.push('apellido');
  if (!String(f.nombreMama || '').trim()) miss.push('nombre de la mamá');
  if (String(f.celMama || '').replace(/\D/g, '').length < 8) miss.push('celular de la mamá');
  if (!String(f.nombrePapa || '').trim()) miss.push('nombre del papá');
  if (String(f.celPapa || '').replace(/\D/g, '').length < 8) miss.push('celular del papá');
  if (!String(f.telEmergencia || '').trim()) miss.push('teléfono de emergencia');
  if (miss.length) { $('#er').textContent = 'Falta: ' + miss.join(', ') + '.'; return; }
  S.kids.forEach(function (k) { if (!k.apellido) k.apellido = f.apellido; });
  if (!S.kids.length) S.kids.push(blankKid());
  go('chicos');
}

function gradoOptions(sel, sexo) {
  var list = S.cfg.grados.filter(function (g) { return !sexo || salaFor(S.cfg, g.grado, sexo); });
  return '<option value="">Elegí…</option>' + list.map(function (g) { return '<option' + (norm(g.grado) === norm(sel) ? ' selected' : '') + '>' + esc(g.grado) + '</option>'; }).join('');
}

function kidPrice(k) {
  var already = k.inscripcion;
  var s = salaFor(S.cfg, k.grado, k.sexo);
  if (!s || !k.semanas.length) return null;
  var sameWeeks = already && already.semanas.join(',') === k.semanas.slice().sort().join(',') && already.sala === s.sala;
  if (sameWeeks) return { sala: s.sala, final: already.precioFinal, desc: already.descEarlyBird, pct: '', modalidad: already.modalidad };
  var eb = already ? already.descEarlyBird > 0 : S.cfg.earlyBirdActivo;
  var p = calcPrice(S.cfg, s.categoria, k.semanas, eb);
  if (!p) return null;
  p.sala = s.sala;
  return p;
}

function kidCard(k, i) {
  var c = S.cfg;
  var head = '<div class="kid-h"><div><b style="font-size:1.08rem">' + esc(k.nombre || 'Nuevo hijo/a') + '</b>' +
    (k.salaAnterior ? '<div class="tiny muted">Estuvo en: ' + esc(k.salaAnterior) + '</div>' : '') +
    (k.gradoSugerido && !k.inscripcion ? '<div class="tiny" style="color:var(--pri)">Pusimos <b>' + esc(k.grado) + '</b> como su sala/grado de este año. Revisalo y cambialo si no es así.</div>' : '') +
    (k.inscripcion ? '<div><span class="pill ok">Ya inscripto/a</span></div>' : '') + '</div>' +
    '<label class="toggle" title="Inscribir"><input type="checkbox" ' + (k.inscribir ? 'checked' : '') + ' onchange="toggleKid(' + i + ',this.checked)"><span></span></label></div>';
  if (!k.inscribir) return '<div class="kid">' + head + '<div class="small muted" style="margin-top:6px">Tocá el botón para inscribirlo/a este año.</div></div>';
  var weeks = c.semanas.map(function (w) {
    var on = k.semanas.indexOf(w.numero) !== -1;
    return '<label class="chk' + (on ? ' on' : '') + '"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="toggleWeek(' + i + ',' + w.numero + ',this)"><span><b>' + esc(w.nombre) + '</b><br><span class="tiny muted">' + fdate(w.desde).substring(0, 5) + ' al ' + fdate(w.hasta).substring(0, 5) + '</span></span></label>';
  }).join('');
  var f = function (label, key, extra) { return '<div><label>' + label + '</label><input data-k="' + i + '" data-f="' + key + '" value="' + esc(k[key]) + '" ' + (extra || '') + ' oninput="kidField(this)"></div>'; };
  return '<div class="kid on">' + head +
    '<div class="grid2">' + f('Nombre *', 'nombre') + f('Apellido', 'apellido') +
    '<div><label>Nena o varón *</label><select data-k="' + i + '" data-f="sexo" onchange="kidField(this)"><option value="">Elegí…</option><option value="N"' + (k.sexo === 'N' ? ' selected' : '') + '>Nena</option><option value="V"' + (k.sexo === 'V' ? ' selected' : '') + '>Varón</option></select></div>' +
    '<div><label>Sala / grado este año *</label><select data-k="' + i + '" data-f="grado" onchange="kidField(this)" title="' + GRADO_HINT + '">' + gradoOptions(k.grado, k.sexo) + '</select></div>' +
    f('Fecha de nacimiento *', 'fechaNac', 'type="date"') + f('Cumpleaños en Ivrit', 'cumpleIvrit') +
    f('Obra social *', 'obraSocial', 'placeholder="Si no tiene, escribí: No tiene"') + f('N° de socio *', 'nroSocio', 'placeholder="Si no tiene, escribí: -"') + '</div>' +
    f('¿Con quién se retira? *', 'retiraCon', 'placeholder="Ej: Mamá, papá o la abuela Sara"') +
    '<div><label>Alergias u observaciones</label><textarea data-k="' + i + '" data-f="alergias" oninput="kidField(this)">' + esc(k.alergias) + '</textarea></div>' +
    '<label>Semanas * <span class="tiny muted">(marcá las que viene)</span></label><div class="weeks">' + weeks + '</div>' +
    '<div class="tot" style="margin-top:10px"><div id="ks' + i + '" class="muted small"></div><div class="price" id="kp' + i + '"></div></div>' +
    (k.nuevo ? '<button class="btn ghost sm" onclick="removeKid(' + i + ')">Quitar</button>' : '') + '</div>';
}

function syncKids() {
  $$('[data-k]').forEach(function (el) { var k = S.kids[+el.dataset.k]; if (k) k[el.dataset.f] = el.value; });
}
function kidField(el) {
  var k = S.kids[+el.dataset.k]; k[el.dataset.f] = el.value;
  if (el.dataset.f === 'sexo') { syncKids(); if (k.grado && !salaFor(S.cfg, k.grado, k.sexo)) k.grado = ''; render(); return; }
  if (el.dataset.f === 'nombre') return; updateKidTotals();
}
function toggleKid(i, on) { syncKids(); S.kids[i].inscribir = on; render(); }
function removeKid(i) { syncKids(); S.kids.splice(i, 1); render(); }
function toggleWeek(i, n, el) {
  var w = S.kids[i].semanas, at = w.indexOf(n);
  if (el.checked && at === -1) w.push(n); if (!el.checked && at !== -1) w.splice(at, 1);
  w.sort(); el.parentNode.classList.toggle('on', el.checked); updateKidTotals();
}
function updateKidTotals() {
  var tot = 0, n = 0;
  S.kids.forEach(function (k, i) {
    if (!k.inscribir) return;
    var p = kidPrice(k), s = $('#ks' + i), pp = $('#kp' + i);
    if (!s) return;
    if (!p) { s.textContent = !salaFor(S.cfg, k.grado, k.sexo) ? 'Elegí nena/varón y la sala/grado para ver el precio' : 'Elegí las semanas'; pp.textContent = ''; return; }
    n++; tot += p.final;
    s.innerHTML = esc(p.sala) + ' · ' + esc(p.modalidad) + (p.desc ? ' · <span style="color:var(--ok)">early bird −' + money(p.desc) + '</span>' : '');
    pp.textContent = money(p.final);
  });
  var kt = $('#kt');
  if (kt) kt.innerHTML = n ? '<div class="tot big" style="border-top:0;margin:0;padding-top:0"><div>' + n + (n === 1 ? ' chico' : ' chicos') + '</div><div>' + money(tot + (S.cfg.materiales || 0)) + '</div></div>' : '';
}

function nextKids() {
  syncKids();
  var sel = S.kids.filter(function (k) { return k.inscribir; });
  if (!sel.length) { $('#er').textContent = 'Elegí al menos un chico para inscribir.'; return; }
  for (var i = 0; i < sel.length; i++) {
    var k = sel[i];
    if (!String(k.nombre).trim()) { $('#er').textContent = 'Falta el nombre de uno de los chicos.'; return; }
    if (!k.sexo) { $('#er').textContent = 'Indicá si ' + k.nombre + ' es nena o varón.'; return; }
    if (!k.grado) { $('#er').textContent = 'Elegí la sala/grado de ' + k.nombre + '.'; return; }
    if (!salaFor(S.cfg, k.grado, k.sexo)) { $('#er').textContent = 'No hay sala para ' + k.nombre + ' con ese grado. Consultá en la oficina.'; return; }
    if (!k.fechaNac) { $('#er').textContent = 'Falta la fecha de nacimiento de ' + k.nombre + '.'; return; }
    if (!String(k.obraSocial || '').trim()) { $('#er').textContent = 'Falta la obra social de ' + k.nombre + ' (si no tiene, escribí "No tiene").'; return; }
    if (!String(k.nroSocio || '').trim()) { $('#er').textContent = 'Falta el N° de socio de ' + k.nombre + ' (si no tiene, escribí "-").'; return; }
    if (!String(k.retiraCon || '').trim()) { $('#er').textContent = 'Falta con quién se retira ' + k.nombre + '.'; return; }
    if (!k.semanas.length) { $('#er').textContent = 'Marcá las semanas que viene ' + k.nombre + '.'; return; }
  }
  // ¿familia del staff? (por email o celular) → el resumen muestra total $0
  var btn = document.querySelector('button[onclick^="nextKids"]');
  busy(btn, server('pub', ['staffCheck', { token: S.token, celMama: S.fam.celMama, celPapa: S.fam.celPapa }]))
    .then(function (r) { S.estado = S.estado || {}; S.estado.esStaff = !!(r && r.esStaff); go('resumen'); })
    .catch(function () { go('resumen'); });
}

function submitReg(btn) {
  if (!S.acepta) { $('#er').textContent = 'Hay que aceptar el reglamento.'; return; }
  var chicos = S.kids.map(function (k) {
    return { id: k.id, nombre: k.nombre, apellido: k.apellido, sexo: k.sexo, fechaNac: k.fechaNac, grado: k.grado, obraSocial: k.obraSocial, nroSocio: k.nroSocio,
      retiraCon: k.retiraCon, cumpleIvrit: k.cumpleIvrit, alergias: k.alergias, inscribir: !!k.inscribir, semanas: k.semanas };
  }).filter(function (k) { return k.inscribir || k.id; });
  busy(btn, server('pub', ['submitRegistration', { token: S.token, familia: S.fam, chicos: chicos, acepta: S.acepta, comentario: S.comentario }])).then(function (r) {
    loadFamily(r); S.justDone = true; go('estado');
  }).catch(function (e) { $('#er').textContent = e.message; });
}

function estadoHtml() {
  var r = S.estado, s = r.saldo || {}, h = stepsBar(4);
  if (S.justDone) h += '<div class="banner ok">✅ ¡Inscripción recibida! Te mandamos un mail con el detalle.</div>';
  var ins = (r.chicos || []).filter(function (k) { return k.inscripcion; });
  h += '<div class="card"><h2>Familia ' + esc(r.familia.apellido) + '</h2>';
  ins.forEach(function (k) {
    h += '<div class="tot"><div><b>' + esc(k.nombre) + '</b><div class="small muted">' + esc(k.inscripcion.sala) + ' · ' + esc(k.inscripcion.modalidad) + '</div></div>' +
      '<div class="price">' + money(k.inscripcion.precioFinal) + '</div></div>';
  });
  if (s.materiales) h += '<div class="tot"><div>Materiales</div><div class="price">' + money(s.materiales) + '</div></div>';
  if (s.staffDesc) h += '<div class="tot"><div>Sin cargo (familia del staff)</div><div class="price">−' + money(s.staffDesc) + '</div></div>';
  if (s.beca) h += '<div class="tot"><div>Ajuste especial</div><div class="price">−' + money(s.beca) + '</div></div>';
  h += '<div class="tot big"><div>Total</div><div>' + money(s.total) + '</div></div>';
  if (s.pagado) h += '<div class="tot"><div>Pagado</div><div class="price" style="color:var(--ok)">' + money(s.pagado) + '</div></div>';
  if (s.porConfirmar) h += '<div class="tot"><div>Comprobantes en revisión</div><div class="price" style="color:var(--warn)">' + money(s.porConfirmar) + '</div></div>';
  h += '<div class="tot big"><div>' + (s.saldo > 0 ? 'Falta pagar' : 'Saldo') + '</div><div style="color:' + (s.saldo > 0 ? 'var(--bad)' : 'var(--ok)') + '">' + money(Math.max(0, s.saldo)) + '</div></div></div>';

  var carnet = ins.length && ins.every(function (k) { return k.inscripcion.carnet; });
  if (carnet) h += '<div class="banner ok">🎟️ El carnet ya fue enviado a tu email. ¡Nos vemos el primer día!</div>';
  else if (s.saldo <= 0 && ins.length) h += '<div class="banner ok">¡Pago completo! El carnet te llega por mail.</div>';

  if (s.saldo > 0) {
    var pend = s.saldo - (s.porConfirmar || 0);
    h += '<div class="card"><h2>Cómo pagar</h2>';
    if (r.cuenta) h += '<p class="muted small">Transferí por Mercado Pago o desde tu banco a este alias:</p><div class="row" style="align-items:center"><div class="alias">' + esc(r.cuenta.alias) + '</div>' +
      '<button class="btn sec sm" style="flex:0 0 auto" onclick="copyText(\'' + esc(r.cuenta.alias) + '\')">Copiar</button></div>' +
      (r.cuenta.titular ? '<div class="small muted">Titular: ' + esc(r.cuenta.titular) + '</div>' : '');
    else h += '<p>Comunicate con la oficina para coordinar el pago.</p>';
    if (r.instrucciones) h += '<p class="small">' + esc(r.instrucciones) + '</p>';
    h += '<p class="small muted">También se puede pagar en efectivo en la oficina.</p>';
    h += '<h3 style="margin-top:18px">Subir comprobante</h3>' +
      '<div class="grid2"><div><label>Monto transferido</label><input id="um" inputmode="decimal" value="' + (pend > 0 ? Math.round(pend) : '') + '"></div>' +
      '<div><label>Nombre del titular que transfirió</label><input id="ut" placeholder="Como figura en la cuenta"></div></div>' +
      '<label>Foto o PDF del comprobante</label><input id="uf" type="file" accept="image/*,application/pdf">' +
      '<div id="er" class="err"></div><div class="actions"><button class="btn block" onclick="upload(this)">Enviar comprobante</button></div></div>';
  }
  h += '<div class="card"><h3>¿Querés inscribir a otro hijo o cambiar semanas?</h3><button class="btn sec block" onclick="editAgain()">Modificar inscripción</button></div>' + contactCard();
  return h;
}

function editAgain() { S.justDone = false; S.acepta = false; if (!S.kids.some(function (k) { return !k.inscribir; })) S.kids.push(blankKid()); go('familia'); }

function upload(btn) {
  var f = $('#uf').files[0], m = numIn($('#um').value);
  if (!m) { $('#er').textContent = 'Poné el monto.'; return; }
  if (!f) { $('#er').textContent = 'Elegí la foto o PDF del comprobante.'; return; }
  busy(btn, readFile(f).then(function (file) {
    return server('pub', ['uploadReceipt', { token: S.token, monto: m, titular: $('#ut').value, cuentaId: S.estado.cuenta ? S.estado.cuenta.id : '', file: file }]);
  })).then(function (r) { loadFamily(r); S.justDone = false; render(); toast('¡Comprobante enviado! Lo revisamos y te avisamos por mail.'); })
    .catch(function (e) { $('#er').textContent = e.message; });
}
</script>
</body>
</html>
