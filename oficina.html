<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>Mini Gan Isroel — Oficina</title><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><meta name="theme-color" content="#12706C"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="oficina.webmanifest"><script>window.API_URL="https://script.google.com/macros/s/AKfycbznuYB1DTCwoVsidDq75R6gq-Mjz9mAqQc_by4wyQXzht9pNg1_eJG7AYM_WRuyDrhL/exec";</script>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--pri:#0f6e6e;--pri2:#0b5555;--acc:#f08a24;--bg:#f6f3ec;--card:#fff;--ink:#22282b;--mut:#6b7378;--line:#e4ded2;--ok:#1a8a4a;--warn:#c77800;--bad:#c0392b;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--pri)}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.05rem}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(135deg,var(--pri),#138a7f);color:#fff;padding:22px 16px 26px;border-radius:0 0 22px 22px}
.hero .k{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:1.7rem;margin:.15em 0 .2em}
.hero p{margin:0;opacity:.92}
.hero .brand{display:flex;align-items:center;gap:14px}
.hero .brand img{width:86px;height:86px;object-fit:contain;flex:none;background:#fff;border-radius:50%;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
@media(max-width:400px){.hero .brand img{width:70px;height:70px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h2,.card h3{margin-top:0}
.muted{color:var(--mut)}.small{font-size:.86rem}.tiny{font-size:.76rem}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 200px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:.84rem;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(15,110,110,.12)}
textarea{min-height:80px;resize:vertical}
.chk{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;background:#fff}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--pri)}
.chk.on{border-color:var(--pri);background:#eef7f6}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.weeks .chk{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:var(--pri);color:#fff;cursor:pointer;text-decoration:none;min-height:46px}
.btn:hover{background:var(--pri2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.acc{background:var(--acc)}
.btn.bad{background:var(--bad)}
.btn.ghost{background:transparent;color:var(--pri);padding:8px 10px;min-height:0}
.btn.sm{padding:7px 12px;min-height:0;font-size:.88rem;border-radius:9px}
.btn.block{width:100%}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;background:#eef0f1;color:#4a5358;white-space:nowrap}
.pill.ok{background:#e3f4ea;color:var(--ok)}.pill.warn{background:#fff1dc;color:var(--warn)}.pill.bad{background:#fde8e6;color:var(--bad)}.pill.pri{background:#e2f1f0;color:var(--pri)}
.banner{border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:600}
.banner.ok{background:#e3f4ea;color:#14663a}.banner.warn{background:#fff1dc;color:#8a5300}.banner.bad{background:#fde8e6;color:#962d22}.banner.info{background:#e2f1f0;color:var(--pri2)}
.err{color:var(--bad);font-weight:600;margin-top:8px}
.price{font-variant-numeric:tabular-nums;font-weight:700}
.tot{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.tot:last-child{border-bottom:0}
.tot.big{font-size:1.15rem;font-weight:800;border-top:2px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:10px}
.alias{font-size:1.35rem;font-weight:800;color:var(--pri);letter-spacing:.02em;word-break:break-all}
.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps span{flex:1;height:5px;border-radius:9px;background:#dcd5c6}
.steps span.on{background:var(--acc)}
.kid{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0;background:#fff}
.kid.on{border-color:var(--pri)}
.kid-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggle{position:relative;width:52px;height:30px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:#cfc8b8;border-radius:30px;transition:.2s;cursor:pointer}
.toggle span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--pri)}
.toggle input:checked+span:before{transform:translateX(22px)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:10px;background:#ebe6dc;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.spin.dark{border-color:rgba(0,0,0,.12);border-top-color:var(--pri)}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#22282b;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25);font-weight:600}
.toast.bad{background:var(--bad)}
.center{text-align:center}
.hide{display:none!important}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(20,24,26,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>.box{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px 30px}
@media(min-width:800px){.modal{align-items:center}.modal>.box{border-radius:20px}}
.modal .close{float:right}
@media print{.noprint{display:none!important}body{background:#fff}.card{border:0;box-shadow:none;padding:0}}
</style>

<style>
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff}
.top .bar1{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;max-width:1000px;margin:0 auto}
.top .who{font-size:.8rem;opacity:.85}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 10px 8px;max-width:1000px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:.9rem;font-weight:600;padding:8px 13px;border-radius:99px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--pri)}
main.wrap{max-width:1000px;padding-bottom:80px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:hover{background:#faf8f3}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:.86rem;cursor:pointer}
.chips button.on{border-color:var(--pri);background:#e2f1f0;color:var(--pri);font-weight:700}
.sect{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 0 6px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.93rem}
.kv b{color:var(--mut);font-weight:600}
.att td.box{width:26px;border-left:1px solid var(--line)}
@media print{.top{display:none}main.wrap{padding:0}.att{font-size:11px}}
</style>
</head>

<script>
/* Utilidades compartidas por las 3 páginas */
var $ = function (s, el) { return (el || document).querySelector(s); };
var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };

function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function money(n) {
  n = Math.round(Number(n) || 0);
  return (n < 0 ? '-$' : '$') + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function numIn(v) {
  var s = String(v || '').replace(/[$\s]/g, '');
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/[.,](?=\d{3}(\D|$))/g, '');
  var n = parseFloat(s); return isNaN(n) ? 0 : n;
}
function fdate(s) {
  if (!s) return '';
  var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : String(s);
}
function today() {
  var d = new Date(); var z = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
}
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }

function toast(msg, bad) {
  var t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, bad ? 5200 : 3200);
}

/** Llama al servidor. fn = 'pub' | 'api' | 'login'. Devuelve una Promise con data o error. */
function server(fn, args) {
  if (window.API_URL) return serverFetch(fn, args);
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(function (res) {
      if (res && res.ok) resolve(res.data);
      else { var e = new Error((res && res.error) || 'Error'); e.auth = res && res.auth; reject(e); }
    }).withFailureHandler(function (e) {
      reject(new Error(/network|NetworkError|Failed to fetch/i.test(String(e && e.message)) ? 'Sin conexión. Revisá internet y probá de nuevo.' : (e && e.message) || 'Error de conexión'));
    });
    r[fn].apply(r, args);
  });
}

/** Versión para la página externa: POST sin cookies de Google. */
function serverFetch(fn, args) {
  var send = function () {
    return fetch(window.API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) });
  };
  return send().catch(function () { return new Promise(function (r) { setTimeout(r, 1200); }).then(send); })
    .catch(function () { throw new Error('Sin conexión. Revisá internet y probá de nuevo.'); })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var res; try { res = JSON.parse(t); } catch (e) { throw new Error('El sistema no respondió bien. Probá de nuevo en un momento.'); }
      if (res && res.ok) return res.data;
      var e = new Error((res && res.error) || 'Error'); e.auth = res && res.auth; throw e;
    });
}

/**
 * Pide datos que cambian poco (configuración): si hay una copia guardada en este aparato se usa al instante
 * y después llega la versión nueva. onData(data, fresh, hadCache).
 */
function cachedServer(key, fn, args, onData, onError) {
  var had = null;
  try { had = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { had = null; }
  if (had) onData(had, false, true);
  return server(fn, args).then(function (d) {
    try { localStorage.setItem(key, JSON.stringify(d)); } catch (e) {}
    onData(d, true, !!had);
  }).catch(function (e) { if (!had && onError) onError(e); });
}

/** Pone un botón en estado "cargando" mientras corre la promesa. */
function busy(btn, promise) {
  if (!btn) return promise;
  var html = btn.innerHTML; btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';
  return promise.then(function (x) { btn.disabled = false; btn.innerHTML = html; return x; },
    function (e) { btn.disabled = false; btn.innerHTML = html; throw e; });
}

/** Lee un archivo (foto o PDF). Las fotos se achican a 1600px para que suban rápido. */
function readFile(file, maxSide) {
  maxSide = maxSide || 1600;
  return new Promise(function (resolve, reject) {
    if (!file) return reject(new Error('No hay archivo'));
    var fr = new FileReader();
    fr.onerror = function () { reject(new Error('No se pudo leer el archivo')); };
    if (!/^image\//.test(file.type) || /gif|svg/.test(file.type)) {
      fr.onload = function () { resolve({ name: file.name, mime: file.type || 'application/pdf', data: String(fr.result).split(',')[1], preview: null }); };
      return fr.readAsDataURL(file);
    }
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height, k = Math.min(1, maxSide / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var url = c.toDataURL('image/jpeg', 0.72);
        resolve({ name: file.name, mime: 'image/jpeg', data: url.split(',')[1], preview: url });
      };
      img.onerror = function () { resolve({ name: file.name, mime: file.type, data: String(fr.result).split(',')[1], preview: fr.result }); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function copyText(t, el) {
  var done = function () { toast('Copiado: ' + t); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { fallbackCopy(t); done(); });
  else { fallbackCopy(t); done(); }
}
function fallbackCopy(t) { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); }

/** Precio en el navegador (igual que el servidor) para mostrarlo en vivo. El servidor siempre recalcula. */
function calcPrice(cfg, categoria, weeks, earlyBird) {
  var p = cfg.precios[categoria];
  if (!p) return null;
  var total = cfg.semanas.length, n = weeks.length;
  if (!n) return null;
  var lista = n >= total ? p.mensual : Math.min(p.semanal * n, p.mensual || Infinity);
  var desc = earlyBird ? Math.round(lista * p.eb / 100 / 100) * 100 : 0;
  return { lista: lista, desc: desc, final: lista - desc, pct: earlyBird ? p.eb : 0, modalidad: n >= total ? 'Mensual' : (n === 1 ? '1 semana' : n + ' semanas') };
}
function salaFor(cfg, grado, sexo) {
  var g = norm(grado), sx = String(sexo || '').toUpperCase().charAt(0), m = null;
  cfg.salas.forEach(function (s) {
    if (m) return;
    if (String(s.grado).split('|').map(norm).indexOf(g) === -1) return;
    if (s.sexo && s.sexo !== 'X' && s.sexo.charAt(0) !== sx) return;
    m = s;
  });
  return m;
}

function payForm() {
  var cuentas = META.cuentas.filter(function (a) { return a.activa; });
  $('#payform').innerHTML = '<div class="card" style="background:#fbfaf6"><div class="grid2">' +
    sel('Concepto', 'pC', ['Cuota', 'Donación'], 'Cuota') +
    sel('Cómo pagó', 'pM', [['Efectivo', 'Efectivo (pesos)'], ['Transferencia', 'Transferencia'], ['Mercado Pago', 'Mercado Pago'], ['Dólares', 'Efectivo en dólares'], ['Otro', 'Otro']], 'Efectivo', 'onchange="payModeChange()"') +
    '<div id="pCtaW" class="hide">' + sel('¿A qué cuenta?', 'pCta', [['', 'Elegí…']].concat(cuentas.map(function (a) { return [a.id, a.alias + (a.limite ? ' (quedan ' + money(Math.max(0, a.restante)) + ')' : '')]; })), '', 'onchange="payCheck()"') + '</div>' +
    fld('Monto', 'pMo', FAM.saldo.saldo > 0 ? Math.round(FAM.saldo.saldo) : '', 'inputmode="decimal" oninput="payCheck()"') +
    '<div id="pTcW" class="hide">' + fld('Tipo de cambio (pesos por dólar)', 'pTc', META.tipoCambio || '', 'inputmode="decimal" oninput="payCheck()"') + '</div>' +
    fld('Fecha', 'pF', today(), 'type="date"') + '<div id="pTiW" class="hide">' + fld('Titular de la cuenta que transfirió', 'pTi', '') + '</div>' + fld('Nota', 'pN', '') + '</div>' +
    '<div id="pWarn"></div><label class="chk on"><input type="checkbox" id="pMail" checked><span>Mandar mail de "pago recibido"</span></label>' +
    '<div class="actions"><button class="btn sec sm" onclick="$(\'#payform\').innerHTML=\'\'">Cancelar</button><button class="btn acc" onclick="savePay(this)">Guardar pago</button></div></div>';
  payModeChange();

function payModeChange() {
  var m = v('pM'), tr = m === 'Transferencia' || m === 'Mercado Pago';
  $('#pCtaW').classList.toggle('hide', !tr); $('#pTiW').classList.toggle('hide', !tr); $('#pTcW').classList.toggle('hide', m !== 'Dólares');
  if (m === 'Dólares' && FAM.saldo.saldo > 0 && META.tipoCambio) $('#pMo').value = Math.ceil(FAM.saldo.saldo / META.tipoCambio);
  payCheck();
}
var payT = null;
function payCheck() {
  var m = v('pM'), cta = v('pCta'), w = $('#pWarn'); if (!w) return;
  var monto = numIn(v('pMo'));
  if (m === 'Dólares') { w.innerHTML = monto ? '<div class="small muted">= ' + money(monto * numIn(v('pTc'))) + ' pesos</div>' : ''; return; }
  if (!(m === 'Transferencia' || m === 'Mercado Pago') || !cta || !monto) { w.innerHTML = ''; return; }
  clearTimeout(payT);
  payT = setTimeout(function () {
    call('checkAccount', { cuentaId: cta, monto: monto }).then(function (r) {
      if (!r) { w.innerHTML = ''; return; }
      w.innerHTML = '<div class="banner ' + (r.nivel === 'lleno' ? 'bad' : r.nivel === 'alerta' ? 'warn' : 'info') + '">' + esc(r.texto) + '</div>';
    }).catch(function () {});
  }, 350);
}
function savePay(btn, confirmar) {
  var m = v('pM');
  var p = { familiaId: FAM.familia.id, concepto: v('pC'), metodo: m === 'Dólares' ? 'Efectivo' : m, moneda: m === 'Dólares' ? 'USD' : 'ARS', monto: numIn(v('pMo')),
    tipoCambio: numIn(v('pTc')), cuentaId: v('pCta'), fecha: v('pF'), titular: v('pTi'), nota: v('pN'), mandarMail: v('pMail'), confirmar: !!confirmar };
  busy(btn, call('addPayment', p)).then(function (d) {
    if (d.necesitaConfirmar) {
      if (confirm(d.warning.texto + '\n\n¿Guardarlo igual?')) savePay(btn, true);
      return;
    }
    famRefresh(d); loadMeta();
    toast('Pago guardado' + (d.mailPago ? ' · mail enviado' : ''));
    if (d.warning && d.warning.nivel !== 'ok') setTimeout(function () { toast(d.warning.texto, d.warning.nivel === 'lleno'); }, 900);
    carnetToast(d.carnet);
  }).catch(fail);
}
function voidPay(id) {

  call('voidPayment', { id: id, motivo: m }).then(function (d) { famRefresh(d); toast('Pago anulado'); }).catch(fail);
}
function sendCarnet() {
  var s = FAM.saldo, force = false;
  if (s.saldo > 0 && !s.habilitadoPorPlan) {
    if (!confirm('Esta familia todavía debe ' + money(s.saldo) + '. ¿Mandar el carnet igual?')) return;
    force = true;
  } else if (FAM.chicos.some(function (k) { return k.inscripcion && k.inscripcion.carnetEnviado; })) force = true;
  call('sendCarnet', { familiaId: FAM.familia.id, force: force }).then(function (r) { toast((r.enviado ? '🎟️ ' : '') + r.motivo, !r.enviado); openFamily(FAM.familia.id); }).catch(fail);
}
function savePlan(btn) {

    .then(function (d) { famRefresh(d); toast('Plan guardado'); carnetToast(d.carnet); }).catch(fail);
}
function saveBecaFam(btn) {

function saveDon(btn, confirmar) {
  var p = { donante: v('dnD'), monto: numIn(v('dnM')), moneda: v('dnC'), tipoCambio: numIn(v('dnT')), metodo: v('dnMe'), cuentaId: v('dnCta'), fecha: v('dnF'), nota: v('dnN'), confirmar: !!confirmar };
  if (!/Transf|Mercado/.test(p.metodo)) p.cuentaId = '';
  busy(btn, call('addDonation', p)).then(function (d) {
    if (d.necesitaConfirmar) { if (confirm(d.warning.texto + '\n\n¿Guardarla igual?')) saveDon(btn, true); return; }
    toast('Donación guardada 💛'); loadMeta();
    if (d.warning && d.warning.nivel !== 'ok') setTimeout(function () { toast(d.warning.texto, d.warning.nivel === 'lleno'); }, 900);
    VIEWS.donaciones();
  }).catch(fail);
}
function delDon(id) { if (!confirm('¿Borrar esta donación?')) return; call('deleteDonation', { id: id }).then(function () { toast('Borrada'); VIEWS.donaciones(); }).catch(fail); }

// ---------------------------------------------------------------- finanzas
VIEWS.finanzas = function () {
  Promise.all([call('finance'), call('earlyBirdUnpaid')]).then(function (r) {
    var f = r[0], eb = r[1];
    var h = '<div class="card"><h2>Resumen de la temporada</h2><div class="stats">' +
      '<div class="stat"><b>' + f.chicos + '</b><span>chicos</span></div><div class="stat"><b>' + money(f.facturado) + '</b><span>a cobrar en total</span></div>' +
      '<div class="stat"><b style="color:var(--ok)">' + money(f.cobrado) + '</b><span>cobrado</span></div><div class="stat"><b style="color:var(--bad)">' + money(f.pendiente) + '</b><span>falta cobrar</span></div>' +
      '<div class="stat"><b>' + money(f.porConfirmar) + '</b><span>comprobantes por confirmar</span></div><div class="stat"><b>' + money(f.donaciones) + '</b><span>donaciones</span></div></div></div>';
    h += '<div class="card"><h2>Resultado</h2>' +
      '<div class="tot"><div>Cobrado + donaciones</div><div class="price">' + money(f.cobrado + f.donaciones) + '</div></div>' +
      '<div class="tot"><div>− Gastos</div><div class="price">' + money(f.gastos.total) + '</div></div>' +
      '<div class="tot"><div>− Sueldos pagados</div><div class="price">' + money(f.sueldos.pagado) + '</div></div>' +
      '<div class="tot big"><div>Hoy</div><div style="color:' + (f.resultadoActual >= 0 ? 'var(--ok)' : 'var(--bad)') + '">' + money(f.resultadoActual) + '</div></div>' +
      '<div class="tot" style="margin-top:10px"><div>Proyectado (si todos pagan y se pagan todos los sueldos)</div><div class="price" style="color:' + (f.resultadoProyectado >= 0 ? 'var(--ok)' : 'var(--bad)') + '">' + money(f.resultadoProyectado) + '</div></div></div>';
    h += '<div class="card"><h2>Descuentos</h2><div class="tot"><div>Precio de lista total</div><div class="price">' + money(f.lista) + '</div></div><div class="tot"><div>Early bird</div><div class="price">−' + money(f.earlyBird) + '</div></div>' +
      '<div class="tot"><div>Becas</div><div class="price">−' + money(f.becas) + '</div></div>' +
      '<div class="tot"><div>Hijos del staff (sin cargo)</div><div class="price">−' + money(f.staff) + '</div></div></div>';
    h += '<div class="card"><h2>Ingresos por forma de pago</h2>' + f.porMetodo.map(function (m) { return '<div class="tot"><div>' + esc(m.metodo) + '</div><div class="price">' + money(m.monto) + '</div></div>'; }).join('') +
      (f.usdRecibidos ? '<p class="small muted">Dólares recibidos: USD ' + f.usdRecibidos + '</p>' : '') + '</div>';
    h += '<div class="card"><h2>Cuentas</h2>' + f.cuentas.filter(function (a) { return a.activa; }).map(accBar).join('') + '</div>';
    h += '<div class="card"><h2>Por categoría</h2>' + f.porCategoria.map(function (c) { return '<div class="tot"><div>' + esc(c.categoria) + ' · ' + c.chicos + ' chicos</div><div class="price">' + money(c.monto) + '</div></div>'; }).join('') + '</div>';
    h += '<div class="card"><h2>Gastos</h2>' + f.gastos.porCategoria.map(function (c) { return '<div class="tot"><div>' + esc(c.categoria) + '</div><div class="price">' + money(c.monto) + '</div></div>'; }).join('') +
      '<div class="tot big"><div>Total</div><div>' + money(f.gastos.total) + '</div></div>' + (f.gastos.aReembolsar ? '<div class="banner warn">Hay ' + money(f.gastos.aReembolsar) + ' para devolver a quienes pagaron de su bolsillo.</div>' : '') + '</div>';
    h += '<div class="card"><h2>Sueldos</h2>' + (f.sueldos.grupos || []).filter(function (g) { return g.personas || g.pagado; }).map(function (g) { return '<div class="tot"><div>' + esc(g.grupo) + ' · ' + g.personas + '</div><div class="price">' + money(g.total) + ' <span class="tiny muted">(falta ' + money(g.saldo) + ')</span></div></div>'; }).join('') + '<div class="tot"><div>' + f.sueldos.personas + ' personas</div><div class="price">' + money(f.sueldos.total) + '</div></div><div class="tot"><div>Pagado</div><div class="price">' + money(f.sueldos.pagado) + '</div></div><div class="tot"><div>Falta pagar</div><div class="price">' + money(f.sueldos.saldo) + '</div></div></div>';
    h += '<div class="card"><h2>Early bird sin pagar</h2><p class="small muted">Familias que recibieron early bird y todavía deben. Fecha límite de pago: ' + (eb.fechaLimite ? fdate(eb.fechaLimite) : 'sin definir') + (eb.vencido ? ' <span class="pill bad">vencida</span>' : '') + '</p>' +
      (eb.familias.length ? eb.familias.map(function (x) {
        return '<div class="li"><div onclick="openFamily(\'' + x.familiaId + '\')"><b>' + esc(x.familia) + '</b><div class="small muted">Descuento ' + money(x.descuento) + ' · debe ' + money(x.saldo) + (x.tienePlan ? ' · tiene plan' : '') + '</div></div>' +
          '<button class="btn ghost sm" onclick="rmEb(\'' + x.familiaId + '\')">Quitar early bird</button></div>';
      }).join('') : '<p class="muted">Ninguna 👍</p>') + '</div>';
    V(h);
  }).catch(fail);
};
function rmEb(id) { if (!confirm('¿Quitar el descuento early bird a esta familia? Su total va a subir.')) return; call('removeEarlyBird', { familiaId: id }).then(function () { toast('Early bird quitado'); VIEWS.finanzas(); }).catch(fail); }

// ---------------------------------------------------------------- ajustes
var SET = null;
VIEWS.ajustes = function () { call('settings').then(function (d) { SET = d; renderSettings(); }).catch(fail); };
function renderSettings(pin) {
  var d = SET, base = d.appUrl || baseUrl();
  var h = (pin ? '<div class="banner ok">PIN nuevo: <b style="font-size:1.3rem;letter-spacing:.1em">' + esc(pin) + '</b> — pasáselo a la persona (no se vuelve a mostrar).</div>' : '') +
    '<div class="card"><h2>Links para compartir</h2><div class="kv small">' + [['Padres', d.links.padres], ['Madrijot', d.links.madrijot], ['Oficina', d.links.oficina]].map(function (l) {
      return '<b>' + l[0] + '</b><span><a href="' + esc(l[1]) + '" target="_blank">' + esc(l[1].replace(/^https?:\/\//, '')) + '</a> <button class="btn ghost sm" onclick="copyText(\'' + esc(l[1]) + '\')">Copiar</button></span>';
    }).join('') +
    '<b>Base de datos</b><span><a href="' + esc(d.dbUrl) + '" target="_blank">Abrir planilla</a></span><b>Carpeta Drive</b><span><a href="' + esc(d.carpetaUrl) + '" target="_blank">Abrir carpeta</a></span></div></div>';
  h += '<div class="card"><h2>Precios</h2><p class="small muted">Todas las semanas = precio mensual. Menos semanas = precio semanal × semanas.</p><div class="scroll"><table class="t"><tr><th>Categoría</th><th>Mensual</th><th>Semanal</th><th>Early bird %</th><th></th></tr>' +
    d.precios.map(function (p, i) {
      return '<tr><td><b>' + esc(p.categoria) + '</b>' + (p.notas ? '<div class="tiny muted">' + esc(p.notas) + '</div>' : '') + '</td><td><input id="prM' + i + '" value="' + esc(p.precioMensual) + '" inputmode="decimal" style="min-width:110px"></td>' +
        '<td><input id="prS' + i + '" value="' + esc(p.precioSemanal) + '" inputmode="decimal" style="min-width:100px"></td><td><input id="prE' + i + '" value="' + esc(p.earlyBirdPct) + '" inputmode="decimal" style="width:70px"></td>' +
        '<td><button class="btn sm" onclick="savePrice(this,' + i + ')">Guardar</button></td></tr>';
    }).join('') + '</table></div></div>';
  h += '<div class="card"><h2>Tarifas por rol (sueldos)</h2><p class="small muted">Monto que se completa solo al agregar a una persona en Sueldos. Grupo: Morot, Madrijot o Staff.</p>' +
    d.tarifas.concat([{ rol: '', grupo: 'Morot', tipoPago: 'fijo', monto: '', notas: '', nuevo: true }]).map(function (t, i) {
      return '<div class="kid"><div class="grid2">' + fld('Rol', 'trR' + i, t.rol, t.nuevo ? 'placeholder="Ej: Morá Gan 3"' : '') + sel('Grupo', 'trG' + i, ['Morot', 'Madrijot', 'Staff'], t.grupo) +
        sel('Se paga', 'trT' + i, [['fijo', 'Monto fijo por temporada'], ['semana', 'Por semana'], ['dia', 'Por día']], t.tipoPago) + fld('Monto', 'trM' + i, t.monto, 'inputmode="decimal"') + '</div>' +
        fld('Notas', 'trN' + i, t.notas) + '<div class="actions"><button class="btn sm' + (t.nuevo ? '' : ' sec') + '" onclick="saveTar(this,' + i + ',\'' + esc(t.rol) + '\')">' + (t.nuevo ? '+ Agregar rol' : 'Guardar') + '</button>' +
        (t.nuevo ? '' : '<button class="btn ghost sm" onclick="delTar(\'' + esc(t.rol) + '\')">Borrar</button>') + '</div></div>';
    }).join('') + '</div>';
  var cfgv = function (k) { var r = d.config.filter(function (c) { return c.clave === k; })[0]; return r ? r.valor : ''; };
  h += '<div class="card"><h2>Dólar</h2><div class="tot big"><div>Cotización que usa la app</div><div>' + money(numIn(cfgv('TipoCambioUSD'))) + '</div></div>' +
    '<p class="small muted">' + (String(cfgv('DolarAutomatico')).toUpperCase() === 'NO' ? 'Automático apagado: se carga a mano en Configuración (TipoCambioUSD).' :
      'Se actualiza sola cada hora con el dólar blue más bajo de dolarhoy.com.') + (cfgv('DolarActualizado') ? '<br>Última: ' + esc(cfgv('DolarActualizado')) : '') + '</p>' +
    '<div class="actions"><button class="btn sec sm" onclick="dolarAhora(this)">Actualizar ahora</button></div></div>';
  h += '<div class="card"><h2>Configuración</h2>' + d.config.map(function (c, i) {
    var long = String(c.valor).length > 60 || /\n/.test(c.valor);
    return '<label>' + esc(c.clave) + '</label>' + (long ? '<textarea id="cf' + i + '" rows="5">' + esc(c.valor) + '</textarea>' : '<input id="cf' + i + '" value="' + esc(c.valor) + '">') + '<div class="tiny muted">' + esc(c.descripcion) + '</div>';
  }).join('') + '<div class="actions"><button class="btn block" onclick="saveCfg(this)">Guardar configuración</button></div></div>';
  h += '<div class="card"><h2>Cuentas para transferencias</h2>' + d.cuentas.map(function (a, i) { return accRow(a, i); }).join('') + accRow({ id: '', alias: '', limite: '', alertaPct: 85, activa: true, mostrarPadres: true, periodoLimite: 'temporada', tipo: 'Mercado Pago' }, 'new') + '</div>';
  h += '<div class="card"><h2>Usuarios de la app</h2>' + d.usuarios.map(function (u) {
    return '<div class="li" style="cursor:default"><div><b>' + esc(u.nombre) + '</b> <span class="pill ' + (u.activo ? 'pri' : '') + '">' + esc(u.rolNombre) + (u.activo ? '' : ' · inactivo') + '</span><div class="small muted">' + esc(u.email) + '</div></div>' +
      '<div><button class="btn ghost sm" onclick="userForm(\'' + u.id + '\')">Editar</button><button class="btn ghost sm" onclick="resetPin(\'' + u.id + '\',\'' + esc(u.nombre) + '\')">Nuevo PIN</button></div></div>';
  }).join('') + '<div id="uform"></div><div class="actions"><button class="btn sec" onclick="userForm(\'\')">+ Agregar usuario (ej: jefa de madrijot)</button></div></div>';
  V(h);
}
function accRow(a, i) {
  return '<div class="kid"><div class="grid2">' + fld('Alias', 'acA' + i, a.alias) + fld('Titular', 'acT' + i, a.titular) + fld('Límite ($, 0 = sin límite)', 'acL' + i, a.limite, 'inputmode="decimal"') +
    sel('El límite es por', 'acP' + i, [['temporada', 'Temporada'], ['mensual', 'Mes'], ['anual', 'Año']], a.periodoLimite) + fld('Avisar al llegar al %', 'acW' + i, a.alertaPct, 'inputmode="numeric"') + fld('Orden', 'acO' + i, a.orden) + '</div>' +
    '<label class="chk"><input type="checkbox" id="acM' + i + '" ' + (a.mostrarPadres ? 'checked' : '') + '><span>Mostrar a los padres para transferir</span></label>' +
    '<label class="chk"><input type="checkbox" id="acV' + i + '" ' + (a.activa ? 'checked' : '') + '><span>Activa</span></label>' +
    (a.id ? '<div class="small muted">Recibido: ' + money(a.usado) + (a.limite ? ' (' + a.pct + '%)' : '') + '</div>' : '') +
    '<div class="actions"><button class="btn sm' + (a.id ? ' sec' : '') + '" onclick="saveAcc(this,\'' + i + '\',\'' + (a.id || '') + '\')">' + (a.id ? 'Guardar' : '+ Agregar cuenta') + '</button></div></div>';
}
function savePrice(btn, i) { var p = SET.precios[i]; busy(btn, call('savePrice', { categoria: p.categoria, precioMensual: numIn(v('prM' + i)), precioSemanal: numIn(v('prS' + i)), earlyBirdPct: numIn(v('prE' + i)) })).then(function (d) { SET = d; loadMeta(); toast('Precio guardado'); }).catch(fail); }
function saveTar(btn, i, original) {
  busy(btn, call('saveTarifa', { original: original, rol: v('trR' + i), grupo: v('trG' + i), tipoPago: v('trT' + i), monto: numIn(v('trM' + i)), notas: v('trN' + i) }))
    .then(function (d) { SET = d; renderSettings(); toast('Tarifa guardada'); }).catch(fail);
}
function delTar(rol) { if (!confirm('¿Borrar la tarifa de ' + rol + '? (no cambia los sueldos ya cargados)')) return; call('saveTarifa', { original: rol, rol: rol, borrar: true }).then(function (d) { SET = d; renderSettings(); toast('Borrada'); }).catch(fail); }
function dolarAhora(btn) { busy(btn, call('dolarAhora')).then(function (d) { SET = d; renderSettings(); toast('Dólar actualizado'); }).catch(fail); }
function saveCfg(btn) { busy(btn, call('saveConfig', { items: SET.config.map(function (c, i) { return { clave: c.clave, valor: $('#cf' + i).value }; }) })).then(function (d) { SET = d; loadMeta(); renderSettings(); toast('Configuración guardada'); }).catch(fail); }
function saveAcc(btn, i, id) {
  busy(btn, call('saveAccount', { id: id, alias: v('acA' + i), titular: v('acT' + i), limite: numIn(v('acL' + i)), periodoLimite: v('acP' + i), alertaPct: numIn(v('acW' + i)), orden: numIn(v('acO' + i)), mostrarPadres: v('acM' + i), activa: v('acV' + i) }))
    .then(function (d) { SET = d; loadMeta(); renderSettings(); toast('Cuenta guardada'); }).catch(fail);
}
function userForm(id) {
  var u = SET.usuarios.filter(function (x) { return x.id === id; })[0] || { nombre: '', email: '', rol: 'jefa', activo: true };
  $('#uform').innerHTML = '<div class="card" style="background:#fbfaf6"><div class="grid2">' + fld('Nombre', 'uN', u.nombre) + fld('Email', 'uE', u.email, 'type="email"') + fld('Celular (sus hijos no pagan)', 'uC', u.celular, 'inputmode="tel"') +
    sel('Rol', 'uR', [['admin', 'Administrador (ve todo)'], ['directora', 'Directora (ve todo)'], ['secretaria', 'Secretaria'], ['jefa', 'Jefa de madrijot (solo gastos y listas)']], u.rol) + '</div>' +
    '<label class="chk"><input type="checkbox" id="uA" ' + (u.activo ? 'checked' : '') + '><span>Activo</span></label>' +
    '<div class="actions"><button class="btn sm" onclick="saveUser(this,\'' + (u.id || '') + '\')">Guardar</button></div></div>';
}
function saveUser(btn, id) { busy(btn, call('saveUser', { id: id, nombre: v('uN'), email: v('uE'), celular: v('uC'), rol: v('uR'), activo: v('uA') })).then(function (d) { SET = d; renderSettings(d.pinNuevo); window.scrollTo(0, 0); }).catch(fail); }
function resetPin(id, n) { if (!confirm('¿Generar un PIN nuevo para ' + n + '?')) return; call('resetPin', { id: id }).then(function (r) { renderSettings(r.pin); window.scrollTo(0, 0); }).catch(fail); }

// ---------------------------------------------------------------- archivos y cuenta
VIEWS.archivos = function () {
  call('files').then(function (list) {
    V('<div class="card"><h2>Archivos</h2>' + (list.length ? list.map(function (f) { return '<div class="li"><a href="' + esc(f.url) + '" target="_blank"><b>' + esc(f.nombre) + '</b></a><span class="small muted">' + esc(f.notas || '') + '</span></div>'; }).join('') : '<p class="muted">No hay archivos.</p>') +
      '<p class="small muted">Para abrirlos tenés que tener acceso en Google Drive con tu cuenta.</p></div>');
  }).catch(fail);
};
VIEWS.cuenta = function () {
  $$('#tabs button').forEach(function (b) { b.classList.remove('on'); });
  V('<div class="card"><h2>' + esc(USER.nombre) + '</h2><p class="muted">' + esc(USER.email) + ' · ' + esc(USER.rolNombre) + '</p>' +
    '<h3>Cambiar mi PIN</h3><div class="grid2">' + fld('PIN actual', 'pA', '', 'type="password" inputmode="numeric"') + fld('PIN nuevo (4 a 8 números)', 'pB', '', 'type="password" inputmode="numeric"') + '</div>' +
    '<div class="actions"><button class="btn sec" onclick="chPin(this)">Cambiar PIN</button><button class="btn bad" onclick="logout()">Salir</button></div></div>' +
    '<div class="card small muted">Tip: en el celular, abrí el menú del navegador y elegí "Agregar a pantalla de inicio" para tener la app como un ícono.</div>');
};
function chPin(btn) { busy(btn, call('changePin', { actual: v('pA'), nuevo: v('pB') })).then(function () { toast('PIN cambiado'); VIEWS.cuenta(); }).catch(fail); }
</script>
</body>
</html>
